        // La cifra explota: crece y cuenta hasta 97 en un solo golpe.
        const counter = { v: 0 };
        const out = document.getElementById('resultados-n');
        tl.fromTo('#resultados-number', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'expo.out' }, 2.2);
        tl.fromTo(counter, { v: 0 }, { v: 97, duration: 1.3, ease: 'power3.out', onUpdate: () => (out.textContent = Math.round(counter.v)) }, 2.2);
