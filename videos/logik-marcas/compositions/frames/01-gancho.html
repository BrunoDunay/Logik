      <script>
        const tl = gsap.timeline({ paused: true });
        // Fondo vivo: los puntos se desplazan y el brillo respira durante toda la escena.
        tl.fromTo('#gancho-dots', { x: 0, y: 0 }, { x: -34, y: -68, duration: 4.2, ease: 'none' }, 0);
        tl.fromTo('#gancho-glow', { scale: 0.85, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 4.2, ease: 'sine.inOut' }, 0);
        tl.fromTo('#gancho-tag', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.1);

        // "No hacemos magia," palabra por palabra, cada una con su propio movimiento.
        tl.fromTo('#gancho-w1', { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power4.out' }, 0.2);
        tl.fromTo('#gancho-w2', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out' }, 0.42);
        tl.fromTo('#gancho-magia', { opacity: 0, scale: 1.25, rotation: -4 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: 'back.out(2)' }, 0.68);

        // "magia" se desvanece en destellos: la frase dice que no es magia.
        const sparks = [
          ['#gancho-s1', -160, -170, 1.3],
          ['#gancho-s2', 170, -140, 0.9],
          ['#gancho-s3', 230, 60, 1.1],
          ['#gancho-s4', -200, 90, 0.8],
          ['#gancho-s5', 40, -230, 1.0],
        ];
        sparks.forEach(([sel, x, y, s], i) => {
          tl.fromTo(sel, { opacity: 0, x: 0, y: 0, scale: 0.2, rotation: 0 }, { opacity: 1, x, y, scale: s, rotation: 90, duration: 0.6, ease: 'power3.out' }, 1.55 + i * 0.04);
          tl.to(sel, { opacity: 0, scale: s * 0.4, duration: 0.45, ease: 'power2.in' }, 2.15 + i * 0.03);
        });
        tl.to('#gancho-magia', { opacity: 0.12, scale: 0.92, filter: 'blur(10px)', duration: 0.5, ease: 'power2.in' }, 1.6);

        // "hacemos marketing." llega con rebote, en el rosa del logo.
        tl.fromTo('#gancho-line-b', { opacity: 0, y: 120, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'back.out(1.8)' }, 2.25);
        tl.to('#gancho-line-a', { opacity: 0.55, duration: 0.5, ease: 'power2.out' }, 2.3);
        tl.to('#gancho-copy', { scale: 1.04, duration: 1.6, ease: 'sine.inOut' }, 2.6);

        window.__timelines['gancho'] = tl;
      </script>
