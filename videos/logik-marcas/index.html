<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Logik Marketing · Más de 70 marcas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #141012;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141012;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- Logik Marketing: video de marca de 30 s para la sección de video del sitio (y Reel de Instagram). -->
    <div data-hf-id="hf-coex" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div data-hf-id="hf-5xet" id="gancho" class="scene" data-composition-id="gancho" data-composition-src="compositions/frames/01-gancho.html" data-start="0" data-duration="4.2" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-8v5z" id="trabajo" class="scene" data-composition-id="trabajo" data-composition-src="compositions/frames/02-trabajo.html" data-start="4.2" data-duration="6" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-ku7f" id="marcas" class="scene" data-composition-id="marcas" data-composition-src="compositions/frames/03-marcas.html" data-start="10.2" data-duration="6.6" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-y9iz" id="resultados" class="scene" data-composition-id="resultados" data-composition-src="compositions/frames/04-resultados.html" data-start="16.8" data-duration="6.6" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div data-hf-id="hf-bpsi" id="cierre" class="scene" data-composition-id="cierre" data-composition-src="compositions/frames/05-cierre.html" data-start="23.4" data-duration="6.6" data-track-index="0" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
