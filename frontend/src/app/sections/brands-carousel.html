@let c = content();

<section class="brands" id="marcas" aria-labelledby="brands-title">
  <div class="wrap brands__head">
    <app-section-heading [title]="c.title" [script]="c.script" [intro]="c.intro" headingId="brands-title" />
    <div class="brands__nav" appReveal>
      <button type="button" class="arrow" aria-label="Marca anterior" (click)="go(index() - 1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-6-6 6 6 6" /></svg>
      </button>
      <button type="button" class="arrow" aria-label="Marca siguiente" (click)="go(index() + 1)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-6 6 6-6 6" /></svg>
      </button>
    </div>
  </div>

  <div
    class="viewport"
    role="region"
    aria-roledescription="carrusel"
    aria-label="Marcas con las que trabajamos"
    (pointerdown)="down($event)"
    (pointerup)="up($event)"
  >
    <ul class="track" role="list">
      @for (s of slots(); track s.brand.name) {
        <li
          class="brand"
          [class.is-active]="s.o === 0"
          [class.is-hidden]="s.hidden"
          [class.has-photo]="!!s.brand.photo"
          [style.--o]="s.o"
          [style.--after]="s.o > 0 ? 1 : 0"
          [style.--brand]="s.brand.color"
          [attr.aria-hidden]="s.hidden ? true : null"
        >
          <button
            type="button"
            class="brand__card"
            [attr.tabindex]="s.hidden ? -1 : null"
            [attr.aria-current]="s.o === 0 ? 'true' : null"
            [attr.aria-label]="s.brand.name"
            (click)="go(s.i)"
          >
            @if (s.brand.photo) {
              <img class="brand__photo" [src]="s.brand.photo" alt="" width="720" height="900" loading="lazy" decoding="async" />
            }
            <span class="brand__tint" aria-hidden="true"></span>
            <img class="brand__logo" [src]="s.brand.logo" [alt]="'Logotipo de ' + s.brand.name" loading="lazy" decoding="async" />
            <span class="brand__info">
              <span class="brand__category">{{ s.brand.category }}</span>
              <span class="brand__name">{{ s.brand.name }}</span>
              <span class="brand__desc">{{ s.brand.description }}</span>
            </span>
          </button>
        </li>
      }
    </ul>
  </div>

  <div class="wrap brands__foot">
    <p class="count" aria-live="polite">
      <strong>{{ pad(index() + 1) }}</strong>
      <span>/ {{ pad(total()) }}</span>
    </p>
  </div>
</section>
