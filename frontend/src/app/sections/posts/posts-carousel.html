@let c = content();

<section class="posts" id="publicaciones" aria-labelledby="posts-title">
  <div class="wrap">
    <app-section-heading [title]="c.title" [script]="c.script" [intro]="c.intro" align="center" headingId="posts-title" />

    <div class="chips" role="group" aria-label="Filtrar por tipo de marca" appReveal>
      @for (cat of c.categories; track cat.id) {
        <button type="button" class="chip" [class.is-active]="cat.id === category()" [attr.aria-pressed]="cat.id === category()" (click)="pick(cat.id)">
          <span class="chip__label">{{ cat.label }}</span>
          <span class="chip__count">{{ counts().get(cat.id) ?? 0 }}</span>
        </button>
      }
    </div>
  </div>

  <div
    class="stage"
    [class.is-switching]="switching()"
    role="region"
    aria-roledescription="carrusel"
    aria-label="Publicaciones"
    tabindex="0"
    (keydown)="onKey($event)"
    (pointerdown)="down($event)"
    (pointerup)="up($event)"
    (pointercancel)="up($event)"
  >
    @for (card of cards(); track card.post.image) {
      <div
        class="card"
        [class.is-center]="card.o === 0"
        [class.is-hidden]="card.hidden"
        [style.--o]="card.o"
        [style.--abs]="card.abs"
        [style.--enter]="card.abs"
        [attr.aria-hidden]="card.o === 0 ? null : true"
      >
        <app-ig-post [post]="card.post" [brand]="brandOf().get(card.post.account) ?? null" [compact]="card.o !== 0" [attr.inert]="card.o === 0 ? null : ''" />
        @if (card.o !== 0 && !card.hidden) {
          <button type="button" class="card__hit" [attr.aria-label]="'Ver publicación ' + (card.i + 1)" (click)="index.set(card.i)"></button>
        }
      </div>
    }
  </div>

  <!-- Indicador discreto: una barra rosa que se desliza y el número de la publicación. -->
  <div class="progress" aria-live="polite" [style.--n]="n()" [style.--i]="index()">
    <span class="progress__track" aria-hidden="true"><span class="progress__thumb"></span></span>
    <span class="progress__count"><strong>{{ index() + 1 }}</strong> de {{ n() }}</span>
  </div>
</section>
