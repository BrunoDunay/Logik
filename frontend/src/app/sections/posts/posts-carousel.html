@let c = content();

<section class="posts" id="publicaciones" aria-labelledby="posts-title">
  <div class="wrap">
    <app-section-heading [title]="c.title" [script]="c.script" [intro]="c.intro" align="center" headingId="posts-title" />

    <div class="chips" role="group" aria-label="Filtrar por tipo de marca" appReveal>
      @for (cat of c.categories; track cat.id) {
        <button type="button" class="chip" [class.is-active]="cat.id === category()" [attr.aria-pressed]="cat.id === category()" (click)="category.set(cat.id)">
          {{ cat.label }}
          <span class="chip__count">{{ counts().get(cat.id) ?? 0 }}</span>
        </button>
      }
    </div>
  </div>

  <div
    class="stage"
    role="region"
    aria-roledescription="carrusel"
    aria-label="Publicaciones"
    tabindex="0"
    (keydown)="onKey($event)"
    (pointerdown)="down($event)"
    (pointerup)="up($event)"
    (pointercancel)="up($event)"
  >
    @for (s of sides(); track s.post.image) {
      <button
        type="button"
        class="side"
        [style.--o]="s.offset"
        [style.--abs]="s.offset < 0 ? -s.offset : s.offset"
        [attr.aria-label]="'Ver publicación ' + (s.i + 1)"
        (click)="index.set(s.i)"
      >
        <img [src]="s.post.image" alt="" width="760" height="950" loading="lazy" decoding="async" />
      </button>
    }
    @if (current(); as post) {
      @for (k of [post.image]; track k) {
        <div class="center" aria-live="polite">
          <app-ig-post [post]="post" />
        </div>
      }
    }
  </div>

  <div class="controls">
    <button type="button" class="arrow" aria-label="Publicación anterior" (click)="go(-1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-6-6 6 6 6" /></svg>
    </button>
    <span class="counter" aria-live="polite">
      <strong>{{ index() + 1 }}</strong> / {{ filtered().length }}
    </span>
    <button type="button" class="arrow" aria-label="Publicación siguiente" (click)="go(1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-6 6 6-6 6" /></svg>
    </button>
  </div>
</section>
