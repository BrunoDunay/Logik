<head>
  <meta charset="utf-8">
  <title>Logik Marketing · No hacemos magia, hacemos marketing.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Agencia de marketing digital en Aguascalientes. Redes, contenido y campañas de Meta para pymes de todo México.">
  <meta name="theme-color" content="#141012">
  <meta property="og:site_name" content="Logik Marketing">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="brand/icon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="brand/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <script>
    // Intro del logo: solo la primera vez en la sesión y si el sistema no pide reducir movimiento.
    // Si algo falla y la intro no termina, a los 7 s se muestra el sitio igual.
    (function () {
      try {
        // "?intro" en la URL la vuelve a mostrar (y "?intro=lento" la reproduce a un cuarto de velocidad).
        var forced = /[?&]intro/.test(location.search);
        var seen = sessionStorage.getItem('logik-intro-visto');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if ((forced || (!seen && !reduced)) && location.pathname === '/') {
          document.documentElement.classList.add('intro-pending');
          setTimeout(function () { document.documentElement.classList.remove('intro-pending'); }, /intro=(lento|t)/.test(location.search) ? 60000 : 7000);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
