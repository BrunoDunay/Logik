<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Logik Marketing | Manejo de redes sociales para empresas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Agencia de marketing digital en Aguascalientes. Redes, contenido y campañas de Meta para pymes de todo México.">
  <meta name="theme-color" content="#141012">
  <meta property="og:site_name" content="Logik Marketing">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="brand/icon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="brand/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <script>
    // Intro del logo: la primera vez en la sesión. Se muestra aunque el sistema tenga las animaciones
    // desactivadas (en Windows es común tenerlas apagadas sin saberlo y el usuario pidió que siempre se vea).
    // Seguro: si a los 9 s la intro no ha empezado (JavaScript bloqueado o muy lento), se muestra el sitio.
    // Si ya empezó, se deja terminar.
    (function () {
      try {
        // "?intro" en la URL la vuelve a mostrar (y "?intro=lento" la reproduce a un cuarto de velocidad).
        var forced = /[?&]intro/.test(location.search);
        var seen = sessionStorage.getItem('logik-intro-visto');
        if ((forced || !seen) && location.pathname === '/') {
          document.documentElement.classList.add('intro-pending');
          setTimeout(function () {
            if (!document.documentElement.dataset.introStarted) document.documentElement.classList.remove('intro-pending');
          }, /intro=(lento|t)/.test(location.search) ? 60000 : 9000);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
